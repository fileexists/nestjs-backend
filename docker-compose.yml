services:
  postgres:
    image: postgres:17-alpine
    container_name: nestjs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nestjs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nestjs_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nestjs} -d ${POSTGRES_DB:-nestjs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit: development SMTP (emails never leave the machine).
  #   SMTP  -> localhost:1025  (inside the compose network: mailpit:1025)
  #   UI    -> http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: nestjs_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Throwaway database for the e2e tests on a real PostgreSQL (profile "test").
  # Port 5433 so it does not clash with the development postgres; data in tmpfs.
  #   docker compose --profile test up -d postgres-test
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    container_name: nestjs_postgres_test
    environment:
      POSTGRES_USER: nestjs
      POSTGRES_PASSWORD: nestjs_secret
      POSTGRES_DB: nestjs_e2e
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestjs -d nestjs_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
